<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Balap Mobil Adu Cepat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:#111;
touch-action:none;
}

/* AREA GAME */
#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:#4caf50;
}

/* JALAN */
#road{
position:absolute;
left:50%;
transform:translateX(-50%);
width:90%;
height:100%;
background:#2f2f2f;
overflow:hidden;
border-left:8px solid white;
border-right:8px solid white;
}

/* GARIS */
.line{
position:absolute;
width:12px;
height:90px;
background:white;
left:50%;
transform:translateX(-50%);
opacity:0.7;
}

/* MOBIL */
.car{
position:absolute;
width:70px;
height:120px;
border-radius:15px;
}

/* PLAYER */
#player{
background:linear-gradient(#ff0000,#a00000);
bottom:20px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 20px rgba(255,0,0,0.8);
}

/* LAWAN */
.enemy1{
background:linear-gradient(#00e5ff,#006064);
}

.enemy2{
background:linear-gradient(#ffd600,#ff6f00);
}

.enemy3{
background:linear-gradient(#76ff03,#33691e);
}

/* KACA */
.car::before{
content:"";
position:absolute;
width:45px;
height:28px;
background:#9be7ff;
top:12px;
left:12px;
border-radius:8px;
}

/* HUD */
#hud{
position:absolute;
top:15px;
left:15px;
z-index:20;
background:rgba(0,0,0,0.5);
padding:15px 20px;
border-radius:15px;
color:white;
font-size:22px;
font-weight:bold;
line-height:1.6;
}

/* FINISH */
#finish{
position:absolute;
top:-200px;
left:0;
width:100%;
height:120px;
background:
repeating-linear-gradient(
90deg,
white 0px,
white 40px,
black 40px,
black 80px
);
z-index:5;
}

/* HASIL */
#result{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:35px;
border-radius:20px;
color:white;
text-align:center;
display:none;
z-index:50;
width:90%;
max-width:400px;
}

#result h1{
font-size:42px;
margin-bottom:20px;
color:#ffd600;
}

#resultText{
font-size:28px;
margin-bottom:20px;
line-height:1.5;
}

#restartBtn{
padding:15px 30px;
font-size:24px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
font-weight:bold;
cursor:pointer;
}

/* KONTROL */
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 25px;
z-index:30;
}

.controlBtn{
width:100px;
height:100px;
border-radius:50%;
background:rgba(255,255,255,0.25);
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
color:white;
backdrop-filter:blur(5px);
user-select:none;
}

.controlBtn:active{
transform:scale(0.95);
background:rgba(255,255,255,0.45);
}

/* HP */
@media(max-width:768px){

.car{
width:60px;
height:100px;
}

.controlBtn{
width:85px;
height:85px;
font-size:38px;
}

#hud{
font-size:18px;
padding:12px 15px;
}

#result h1{
font-size:32px;
}

#resultText{
font-size:22px;
}

}

/* TV */
@media(min-width:1200px){

.car{
width:90px;
height:150px;
}

.controlBtn{
width:150px;
height:150px;
font-size:60px;
}

}

</style>
</head>
<body>

<div id="game">

<div id="road">

<div id="finish"></div>

</div>

<!-- HUD -->
<div id="hud">
<div>🏁 Posisi: <span id="position">4</span>/4</div>
<div>🚀 Kecepatan: <span id="speed">0</span></div>
</div>

<!-- PLAYER -->
<div id="player" class="car"></div>

<!-- LAWAN -->
<div id="enemy1" class="car enemy1"></div>
<div id="enemy2" class="car enemy2"></div>
<div id="enemy3" class="car enemy3"></div>

<!-- HASIL -->
<div id="result">

<h1>FINISH</h1>

<div id="resultText"></div>

<button id="restartBtn">
MAIN LAGI
</button>

</div>

<!-- KONTROL -->
<div id="controls">

<div class="controlBtn" id="leftBtn">
⬅
</div>

<div class="controlBtn" id="rightBtn">
➡
</div>

</div>

</div>

<script>

/* =========================
   ELEMENT
========================= */

const player = document.getElementById("player");
const enemy1 = document.getElementById("enemy1");
const enemy2 = document.getElementById("enemy2");
const enemy3 = document.getElementById("enemy3");

const positionText =
document.getElementById("position");

const speedText =
document.getElementById("speed");

const finish =
document.getElementById("finish");

const result =
document.getElementById("result");

const resultText =
document.getElementById("resultText");

/* =========================
   POSISI AWAL
========================= */

let playerX = window.innerWidth / 2 - 35;

player.style.left = playerX + "px";

enemy1.style.left = "20%";
enemy2.style.left = "45%";
enemy3.style.left = "70%";

enemy1.style.top = "200px";
enemy2.style.top = "350px";
enemy3.style.top = "500px";

/* =========================
   DATA BALAP
========================= */

let roadY = 0;

let playerDistance = 0;

let enemy1Distance = 0;
let enemy2Distance = 0;
let enemy3Distance = 0;

let playerSpeed = 8;

let playing = true;

const FINISH_DISTANCE = 5000;

/* =========================
   GARIS JALAN
========================= */

for(let i=0;i<15;i++){

let line = document.createElement("div");

line.classList.add("line");

line.style.top = (i * 120) + "px";

document.getElementById("road")
.appendChild(line);

}

function moveRoad(){

const lines =
document.querySelectorAll(".line");

lines.forEach(line=>{

let top = parseInt(line.style.top);

top += playerSpeed;

if(top > window.innerHeight){

top = -120;

}

line.style.top = top + "px";

});

}

/* =========================
   GERAK LAWAN
========================= */

function moveEnemies(){

enemy1Distance +=
Math.random() * 10;

enemy2Distance +=
Math.random() * 9;

enemy3Distance +=
Math.random() * 11;

}

/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

playerDistance += playerSpeed;

speedText.innerHTML =
playerSpeed;

}

/* =========================
   POSISI BALAP
========================= */

function updatePosition(){

const racers = [

playerDistance,
enemy1Distance,
enemy2Distance,
enemy3Distance

];

const sorted =
[...racers].sort((a,b)=>b-a);

const position =
sorted.indexOf(playerDistance)+1;

positionText.innerHTML =
position;

}

/* =========================
   FINISH
========================= */

function checkFinish(){

if(
playerDistance >= FINISH_DISTANCE ||
enemy1Distance >= FINISH_DISTANCE ||
enemy2Distance >= FINISH_DISTANCE ||
enemy3Distance >= FINISH_DISTANCE
){

playing = false;

result.style.display = "block";

const racers = [

{
name:"Kamu",
distance:playerDistance
},

{
name:"Mobil Biru",
distance:enemy1Distance
},

{
name:"Mobil Kuning",
distance:enemy2Distance
},

{
name:"Mobil Hijau",
distance:enemy3Distance
}

];

racers.sort((a,b)=>
b.distance-a.distance
);

const posisi =
racers.findIndex(
r=>r.name==="Kamu"
)+1;

resultText.innerHTML = `
🏆 Posisi Akhir: ${posisi}/4
`;

navigator.vibrate?.([200,100,200]);

}

}

/* =========================
   UPDATE GAME
========================= */

function update(){

if(!playing) return;

moveRoad();

moveEnemies();

updatePlayer();

updatePosition();

checkFinish();

requestAnimationFrame(update);

}

update();

/* =========================
   GERAK PLAYER
========================= */

function moveLeft(){

playerX -= 15;

if(playerX < 20){

playerX = 20;

}

player.style.left =
playerX + "px";

}

function moveRight(){

playerX += 15;

if(
playerX >
window.innerWidth - 100
){

playerX =
window.innerWidth - 100;

}

player.style.left =
playerX + "px";

}

/* =========================
   KONTROL HP
========================= */

let moveInterval;

function startMove(direction){

clearInterval(moveInterval);

moveInterval = setInterval(()=>{

if(direction==="left"){

moveLeft();

}else{

moveRight();

}

},16);

}

function stopMove(){

clearInterval(moveInterval);

}

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

leftBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

startMove("left");

}
);

leftBtn.addEventListener(
"touchend",
stopMove
);

rightBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

startMove("right");

}
);

rightBtn.addEventListener(
"touchend",
stopMove
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(e.key==="ArrowLeft"){

moveLeft();

}

if(e.key==="ArrowRight"){

moveRight();

}

}
);

/* =========================
   RESTART
========================= */

document.getElementById("restartBtn")
.addEventListener(
"click",
()=>{

location.reload();

}
);

/* =========================
   FULLSCREEN
========================= */

document.body.addEventListener(
"click",
()=>{

const el =
document.documentElement;

if(el.requestFullscreen){

el.requestFullscreen()
.catch(()=>{});

}

},
{once:true}
);

</script>

</body>
</html>
