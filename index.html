<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Tangkap Kotak Mobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
touch-action:manipulation;
}

.game-container{
width:100%;
max-width:900px;
padding:15px;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:15px;
color:#ffd700;
text-shadow:0 0 15px rgba(255,215,0,0.7);
}

.info{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.1);
padding:15px;
border-radius:15px;
margin-bottom:15px;
font-size:24px;
font-weight:bold;
backdrop-filter:blur(10px);
}

#startBtn{
width:100%;
padding:18px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:15px;
background:#00c853;
color:white;
cursor:pointer;
margin-bottom:15px;
box-shadow:0 0 20px rgba(0,200,83,0.5);
transition:0.2s;
}

#startBtn:active{
transform:scale(0.97);
}

#gameArea{
width:100%;
height:65vh;
background:rgba(255,255,255,0.08);
border:4px solid rgba(255,255,255,0.2);
border-radius:25px;
position:relative;
overflow:hidden;
backdrop-filter:blur(5px);
}

#box{
width:80px;
height:80px;
background:linear-gradient(135deg,#ff1744,#ff5252);
position:absolute;
display:none;
border-radius:20px;
cursor:pointer;
box-shadow:
0 0 20px rgba(255,0,0,0.8),
0 0 40px rgba(255,0,0,0.4);
transition:0.1s;
touch-action:none;
}

#box:active{
transform:scale(0.9);
}

#result{
margin-top:20px;
font-size:32px;
color:#ffd700;
font-weight:bold;
text-shadow:0 0 10px rgba(255,215,0,0.7);
}

.instructions{
margin-top:15px;
font-size:18px;
opacity:0.8;
}

/* HP */
@media(max-width:768px){

body{
align-items:flex-start;
padding-top:10px;
}

.game-container{
padding:10px;
}

h1{
font-size:30px;
}

.info{
font-size:18px;
padding:12px;
}

#startBtn{
font-size:20px;
padding:15px;
}

#gameArea{
height:60vh;
}

#box{
width:70px;
height:70px;
}

#result{
font-size:24px;
}

.instructions{
font-size:15px;
}

}

/* Android TV */
@media(min-width:1200px){

#gameArea{
height:70vh;
}

#box{
width:100px;
height:100px;
}

}

</style>
</head>
<body>

<div class="game-container">

<h1>🎮 Tangkap Kotak</h1>

<div class="info">
<div>🏆 Score: <span id="score">0</span></div>
<div>⏰ Waktu: <span id="time">30</span></div>
</div>

<button id="startBtn">▶ MULAI GAME</button>

<div id="gameArea">
<div id="box"></div>
</div>

<div class="instructions">
Tap kotak merah secepat mungkin sebelum waktu habis!
</div>

<h2 id="result"></h2>

</div>

<script>

const box = document.getElementById("box");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const startBtn = document.getElementById("startBtn");
const result = document.getElementById("result");
const gameArea = document.getElementById("gameArea");

let score = 0;
let time = 30;
let gameRunning = false;
let timer;

function randomPosition(){

const boxSize = box.offsetWidth;

const maxX = gameArea.clientWidth - boxSize;
const maxY = gameArea.clientHeight - boxSize;

const randomX = Math.floor(Math.random() * maxX);
const randomY = Math.floor(Math.random() * maxY);

box.style.left = randomX + "px";
box.style.top = randomY + "px";

}

function hitBox(){

if(!gameRunning) return;

score++;

scoreText.textContent = score;

navigator.vibrate?.(50);

box.animate([
{ transform:"scale(1)" },
{ transform:"scale(1.2)" },
{ transform:"scale(1)" }
],{
duration:120
});

randomPosition();

}

box.addEventListener("click", hitBox);

box.addEventListener("touchstart", (e)=>{
e.preventDefault();
hitBox();
});

startBtn.addEventListener("click", startGame);

startBtn.addEventListener("touchstart", (e)=>{
e.preventDefault();
startGame();
});

function startGame(){

score = 0;
time = 30;
gameRunning = true;

scoreText.textContent = score;
timeText.textContent = time;

result.textContent = "";

box.style.display = "block";

randomPosition();

clearInterval(timer);

timer = setInterval(()=>{

time--;

timeText.textContent = time;

if(time <= 0){

clearInterval(timer);

gameRunning = false;

box.style.display = "none";

result.innerHTML = `
🎉 GAME SELESAI<br>
Score Kamu: ${score}
`;

}

},1000);

}

/* Fullscreen HP */
document.addEventListener("click", ()=>{

const elem = document.documentElement;

if(elem.requestFullscreen){
elem.requestFullscreen().catch(()=>{});
}

},{ once:true });

</script>

</body>
</html>
