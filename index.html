<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tak Tik Arena</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}


body{

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(135deg,#000428,#004e92);

color:white;

}


.game{

width:390px;
padding:20px;

background:#ffffff22;

border-radius:30px;

text-align:center;

backdrop-filter:blur(15px);

}


h1{
margin:5px;
}


input,select,button{

padding:12px;

border:0;

border-radius:25px;

margin:4px;

}


button{

background:#00ff99;

}



.stats{

display:flex;
justify-content:space-around;

background:#0005;

border-radius:20px;

margin-top:10px;

}



.board{

display:grid;

grid-template-columns:repeat(3,90px);

gap:10px;

justify-content:center;

margin:20px;

}



.cell{

width:90px;
height:90px;

background:#ffffff33;

border-radius:20px;

font-size:55px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

transition:.2s;

}



.cell:hover{

transform:scale(1.1);

}



.win{

animation:boom .5s infinite alternate;

}



@keyframes boom{

to{
transform:scale(1.3);
}

}



.rank{

background:#0005;

border-radius:15px;

padding:10px;

}


</style>

</head>


<body>



<div class="game">


<h1>🎮 TAK TIK ARENA</h1>


<input id="nama"
placeholder="Nama">


<select id="avatar">

<option>😀</option>
<option>😎</option>
<option>🐯</option>
<option>👑</option>
<option>🤖</option>

</select>


<br>


<select id="level">

<option value="1">
Level Mudah
</option>

<option value="2">
Level Sedang
</option>

<option value="3">
Level Sulit
</option>

</select>


<button onclick="start()">
Mulai
</button>



<div class="stats">


<div>
⭐ Level
<h3 id="lvl">1</h3>
</div>


<div>
🪙 Koin
<h3 id="coin">100</h3>
</div>


<div>
🏆 Menang
<h3 id="win">0</h3>
</div>


</div>



<div id="board"
class="board"></div>


<h3 id="info">
Tekan mulai
</h3>



<div class="rank">

🏆 Ranking

<div id="rank"></div>

</div>


<button onclick="fullscreen()">
📱 Fullscreen
</button>



</div>





<script>


let papan;

let jalan=false;

let pemain="X";


let data={

level:1,

coin:100,

win:0

};



let ranking=
JSON.parse(localStorage.rank||"[]");



const sound=
new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);





function start(){


papan=[

"","","",
"","","",
"","",""

];


jalan=true;


gambar();



info.innerHTML=
nama.value+
" bermain";



}





function gambar(){


board.innerHTML="";



papan.forEach((v,i)=>{


let b=document.createElement("div");


b.className="cell";


b.innerHTML=
v=="X"
?
avatar.value
:
v;


b.onclick=()=>main(i);



board.appendChild(b);



});



}




function main(i){


if(!jalan)return;


if(papan[i]!="")
return;



papan[i]="X";


sound.play();



gambar();



if(check("X")){

menang("KAMU MENANG 🎉");

return;

}



if(!papan.includes("")){

info.innerHTML="Seri 🤝";

return;

}



setTimeout(ai,400);



}





function ai(){


let lv=
document.getElementById("level").value;


let move;


if(lv==1)

move=random();


else

move=minimax(papan,"O").index;



papan[move]="O";



gambar();



if(check("O")){

menang("AI MENANG 🤖");

return;

}



}





function minimax(b,p){


let kosong=[];


b.forEach((x,i)=>{

if(x=="")
kosong.push(i);

});



if(winState(b,"O"))
return {score:10};


if(winState(b,"X"))
return {score:-10};



if(kosong.length==0)
return {score:0};



let moves=[];



for(let i of kosong){


let c=[...b];


c[i]=p;



let r=
p=="O"
?
minimax(c,"X")
:
minimax(c,"O");



moves.push({

index:i,

score:r.score

});

}



return p=="O"

?

moves.reduce((a,b)=>
a.score>b.score?a:b)

:

moves.reduce((a,b)=>
a.score<b.score?a:b);


}





function random(){


let a=[];


papan.forEach((x,i)=>{

if(!x)a.push(i);

});


return a[
Math.floor(Math.random()*a.length)
];

}





function check(p){

return winState(papan,p);

}



function winState(b,p){


let pola=[

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];


return pola.some(x=>

x.every(i=>b[i]==p)

);


}





function menang(t){


jalan=false;


info.innerHTML=
"<span class='win'>"+t+"</span>";



if(t.includes("KAMU")){


data.win++;

data.coin+=50;


ranking.push({

nama:nama.value,

score:data.win

});



localStorage.rank=
JSON.stringify(ranking);


}



lvl.innerHTML=data.level;

coin.innerHTML=data.coin;

win.innerHTML=data.win;



tampilRank();

}





function tampilRank(){


rank.innerHTML="";


ranking
.sort((a,b)=>b.score-a.score)
.slice(0,5)
.forEach((x,i)=>{


rank.innerHTML+=

(i+1)+". "+
x.nama+
" ⭐"+
x.score+
"<br>";


});


}




function fullscreen(){


document.documentElement.requestFullscreen();

}




tampilRank();



</script>


</body>
</html>
