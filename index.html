<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Balap 3 Mobil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
touch-action:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:#444;
}

/* Jalan */
#road{
position:absolute;
width:100%;
height:100%;
background:#2c2c2c;
overflow:hidden;
}

/* Garis jalan */
.line{
position:absolute;
width:10px;
height:80px;
background:white;
left:50%;
transform:translateX(-50%);
}

/* Mobil Player */
#player{
position:absolute;
width:70px;
height:120px;
background:red;
bottom:20px;
left:50%;
transform:translateX(-50%);
border-radius:15px;
box-shadow:0 0 20px rgba(255,0,0,0.8);
}

/* Musuh */
.enemy{
position:absolute;
width:70px;
height:120px;
background:yellow;
top:-150px;
border-radius:15px;
}

/* HUD */
#hud{
position:absolute;
top:10px;
left:10px;
z-index:10;
color:white;
font-size:24px;
font-weight:bold;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
}

#gameOver{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:40px;
font-weight:bold;
display:none;
text-align:center;
z-index:20;
background:rgba(0,0,0,0.8);
padding:30px;
border-radius:20px;
}

#restartBtn{
margin-top:20px;
padding:15px 30px;
font-size:22px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
cursor:pointer;
}

/* Kontrol HP */
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 30px;
z-index:10;
}

.controlBtn{
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.2);
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
color:white;
user-select:none;
backdrop-filter:blur(5px);
}

.controlBtn:active{
background:rgba(255,255,255,0.4);
}

@media(min-width:1000px){

.controlBtn{
width:150px;
height:150px;
font-size:60px;
}

#player,.enemy{
width:90px;
height:150px;
}

}

</style>
</head>
<body>

<div id="game">

<div id="road"></div>

<div id="hud">
Score: <span id="score">0</span>
</div>

<div id="player"></div>

<div id="gameOver">
🚗 GAME OVER<br>
<div id="finalScore"></div>
<button id="restartBtn">Main Lagi</button>
</div>

<div id="controls">
<div class="controlBtn" id="leftBtn">⬅</div>
<div class="controlBtn" id="rightBtn">➡</div>
</div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

let playerX = window.innerWidth / 2 - 35;
let score = 0;
let speed = 8;
let playing = true;

const enemies = [];

/* Garis jalan */
for(let i=0;i<15;i++){

let line = document.createElement("div");
line.classList.add("line");
line.style.top = (i * 100) + "px";

document.getElementById("road").appendChild(line);

}

/* Buat 3 mobil musuh */
for(let i=0;i<3;i++){

createEnemy(i);

}

function createEnemy(index){

let enemy = document.createElement("div");

enemy.classList.add("enemy");

enemy.style.left = (Math.random() * (window.innerWidth - 80)) + "px";

enemy.style.top = (-300 * index) + "px";

game.appendChild(enemy);

enemies.push(enemy);

}

function moveRoad(){

const lines = document.querySelectorAll(".line");

lines.forEach(line=>{

let top = parseInt(line.style.top);

top += speed;

if(top > window.innerHeight){

top = -100;

}

line.style.top = top + "px";

});

}

function moveEnemies(){

enemies.forEach(enemy=>{

let top = parseInt(enemy.style.top);

top += speed + 3;

if(top > window.innerHeight){

top = -200;

enemy.style.left =
(Math.random() * (window.innerWidth - 80)) + "px";

score++;

scoreText.textContent = score;

if(score % 10 === 0){

speed++;

}

}

enemy.style.top = top + "px";

checkCollision(enemy);

});

}

function checkCollision(enemy){

const playerRect = player.getBoundingClientRect();
const enemyRect = enemy.getBoundingClientRect();

if(
playerRect.left < enemyRect.right &&
playerRect.right > enemyRect.left &&
playerRect.top < enemyRect.bottom &&
playerRect.bottom > enemyRect.top
){

endGame();

}

}

function endGame(){

playing = false;

gameOver.style.display = "block";

finalScore.innerHTML = "Score Kamu: " + score;

navigator.vibrate?.([200,100,200]);

}

function update(){

if(!playing) return;

moveRoad();

moveEnemies();

requestAnimationFrame(update);

}

update();

/* Gerak Mobil */
function moveLeft(){

playerX -= 40;

if(playerX < 0){
playerX = 0;
}

player.style.left = playerX + "px";

}

function moveRight(){

playerX += 40;

if(playerX > window.innerWidth - player.offsetWidth){
playerX = window.innerWidth - player.offsetWidth;
}

player.style.left = playerX + "px";

}

/* Tombol HP */
document.getElementById("leftBtn").addEventListener("touchstart",(e)=>{
e.preventDefault();
moveLeft();
});

document.getElementById("rightBtn").addEventListener("touchstart",(e)=>{
e.preventDefault();
moveRight();
});

/* Keyboard */
document.addEventListener("keydown",(e)=>{

if(e.key === "ArrowLeft"){
moveLeft();
}

if(e.key === "ArrowRight"){
moveRight();
}

});

/* Restart */
restartBtn.addEventListener("click",()=>{

location.reload();

});

/* Fullscreen otomatis */
document.body.addEventListener("click",()=>{

const el = document.documentElement;

if(el.requestFullscreen){
el.requestFullscreen().catch(()=>{});
}

},{once:true});

</script>

</body>
</html>
