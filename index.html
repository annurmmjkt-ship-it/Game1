<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Balap Mobil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:#111;
touch-action:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:#4caf50;
}

#road{
position:absolute;
left:50%;
transform:translateX(-50%);
width:90%;
height:100%;
background:#2c2c2c;
border-left:8px solid white;
border-right:8px solid white;
overflow:hidden;
}

/* GARIS */
.line{
position:absolute;
width:12px;
height:90px;
background:white;
left:50%;
transform:translateX(-50%);
opacity:0.7;
}

/* MOBIL */
.car{
position:absolute;
width:70px;
height:120px;
border-radius:15px;
}

.car::before{
content:"";
position:absolute;
width:45px;
height:28px;
background:#9be7ff;
top:12px;
left:12px;
border-radius:8px;
}

/* PLAYER */
#player{
background:linear-gradient(#ff0000,#990000);
bottom:30px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 20px rgba(255,0,0,0.8);
}

/* LAWAN */
.enemy1{
background:linear-gradient(#00e5ff,#006064);
}

.enemy2{
background:linear-gradient(#ffd600,#ff6f00);
}

.enemy3{
background:linear-gradient(#76ff03,#33691e);
}

/* HUD */
#hud{
position:absolute;
top:15px;
left:15px;
z-index:20;
background:rgba(0,0,0,0.5);
padding:15px 20px;
border-radius:15px;
color:white;
font-size:22px;
font-weight:bold;
line-height:1.6;
}

/* RESULT */
#result{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:35px;
border-radius:20px;
text-align:center;
color:white;
display:none;
z-index:50;
width:90%;
max-width:400px;
}

#result h1{
font-size:42px;
margin-bottom:20px;
color:#ffd600;
}

#resultText{
font-size:28px;
margin-bottom:20px;
}

#restartBtn{
padding:15px 30px;
font-size:24px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
font-weight:bold;
cursor:pointer;
}

/* KONTROL */
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:15px;
z-index:30;
flex-wrap:wrap;
}

.controlBtn{
width:90px;
height:90px;
border-radius:20px;
background:rgba(255,255,255,0.2);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
color:white;
backdrop-filter:blur(5px);
user-select:none;
}

.controlBtn:active{
transform:scale(0.95);
background:rgba(255,255,255,0.45);
}

#middleControls{
display:flex;
gap:15px;
}

@media(max-width:768px){

.car{
width:60px;
height:100px;
}

.controlBtn{
width:75px;
height:75px;
font-size:35px;
}

#hud{
font-size:18px;
padding:12px 15px;
}

}

</style>
</head>
<body>

<div id="game">

<div id="road"></div>

<!-- HUD -->
<div id="hud">

<div>
🏁 Posisi:
<span id="position">4</span>/4
</div>

<div>
🚀 Kecepatan:
<span id="speed">0</span>
</div>

</div>

<!-- PLAYER -->
<div id="player" class="car"></div>

<!-- LAWAN -->
<div id="enemy1" class="car enemy1"></div>
<div id="enemy2" class="car enemy2"></div>
<div id="enemy3" class="car enemy3"></div>

<!-- RESULT -->
<div id="result">

<h1>FINISH</h1>

<div id="resultText"></div>

<button id="restartBtn">
MAIN LAGI
</button>

</div>

<!-- KONTROL -->
<div id="controls">

<div class="controlBtn" id="upBtn">
⬆
</div>

<div id="middleControls">

<div class="controlBtn" id="leftBtn">
⬅
</div>

<div class="controlBtn" id="rightBtn">
➡
</div>

</div>

<div class="controlBtn" id="downBtn">
⬇
</div>

</div>

</div>

<script>

/* =========================
   ELEMENT
========================= */

const player =
document.getElementById("player");

const enemy1 =
document.getElementById("enemy1");

const enemy2 =
document.getElementById("enemy2");

const enemy3 =
document.getElementById("enemy3");

const positionText =
document.getElementById("position");

const speedText =
document.getElementById("speed");

const result =
document.getElementById("result");

const resultText =
document.getElementById("resultText");

/* =========================
   PLAYER
========================= */

let playerX =
window.innerWidth / 2 - 35;

player.style.left =
playerX + "px";

/* =========================
   POSISI LAWAN
========================= */

enemy1.style.left = "20%";
enemy2.style.left = "45%";
enemy3.style.left = "70%";

let enemy1Y = 0;
let enemy2Y = -200;
let enemy3Y = -400;

/* =========================
   GAME DATA
========================= */

let speed = 0;

let maxSpeed = 25;

let playing = true;

let playerDistance = 0;

let enemy1Distance = 0;
let enemy2Distance = 0;
let enemy3Distance = 0;

const FINISH_DISTANCE = 7000;

/* =========================
   GARIS JALAN
========================= */

for(let i=0;i<15;i++){

let line =
document.createElement("div");

line.classList.add("line");

line.style.top =
(i * 120) + "px";

document.getElementById("road")
.appendChild(line);

}

function moveRoad(){

const lines =
document.querySelectorAll(".line");

lines.forEach(line=>{

let top =
parseInt(line.style.top);

top += speed;

if(top > window.innerHeight){

top = -120;

}

line.style.top =
top + "px";

});

}

/* =========================
   GERAK LAWAN
========================= */

function moveEnemies(){

let e1Speed =
8 + Math.random()*3;

let e2Speed =
9 + Math.random()*3;

let e3Speed =
7 + Math.random()*4;

/* Mobil bergerak sendiri */

enemy1Y += e1Speed;
enemy2Y += e2Speed;
enemy3Y += e3Speed;

enemy1Distance += e1Speed;
enemy2Distance += e2Speed;
enemy3Distance += e3Speed;

/* Loop */

if(enemy1Y > window.innerHeight){

enemy1Y = -200;

}

if(enemy2Y > window.innerHeight){

enemy2Y = -300;

}

if(enemy3Y > window.innerHeight){

enemy3Y = -400;

}

enemy1.style.top =
enemy1Y + "px";

enemy2.style.top =
enemy2Y + "px";

enemy3.style.top =
enemy3Y + "px";

}

/* =========================
   PLAYER
========================= */

function updatePlayer(){

playerDistance += speed;

speedText.innerHTML =
Math.floor(speed);

}

/* =========================
   POSISI
========================= */

function updatePosition(){

const racers = [

playerDistance,
enemy1Distance,
enemy2Distance,
enemy3Distance

];

const sorted =
[...racers].sort((a,b)=>b-a);

const position =
sorted.indexOf(playerDistance)+1;

positionText.innerHTML =
position;

}

/* =========================
   FINISH
========================= */

function checkFinish(){

if(
playerDistance >= FINISH_DISTANCE ||
enemy1Distance >= FINISH_DISTANCE ||
enemy2Distance >= FINISH_DISTANCE ||
enemy3Distance >= FINISH_DISTANCE
){

playing = false;

result.style.display = "block";

const racers = [

{
name:"Kamu",
distance:playerDistance
},

{
name:"Mobil Biru",
distance:enemy1Distance
},

{
name:"Mobil Kuning",
distance:enemy2Distance
},

{
name:"Mobil Hijau",
distance:enemy3Distance
}

];

racers.sort((a,b)=>
b.distance-a.distance
);

const posisi =
racers.findIndex(
r=>r.name==="Kamu"
)+1;

resultText.innerHTML = `
🏆 Posisi Akhir:
${posisi}/4
`;

navigator.vibrate?.(
[200,100,200]
);

}

}

/* =========================
   UPDATE GAME
========================= */

function update(){

if(!playing) return;

moveRoad();

moveEnemies();

updatePlayer();

updatePosition();

checkFinish();

requestAnimationFrame(update);

}

update();

/* =========================
   GERAK MOBIL
========================= */

function moveLeft(){

playerX -= 12;

if(playerX < 20){

playerX = 20;

}

player.style.left =
playerX + "px";

}

function moveRight(){

playerX += 12;

if(
playerX >
window.innerWidth - 100
){

playerX =
window.innerWidth - 100;

}

player.style.left =
playerX + "px";

}

/* =========================
   GAS & REM
========================= */

function accelerate(){

speed += 0.5;

if(speed > maxSpeed){

speed = maxSpeed;

}

}

function brake(){

speed -= 0.7;

if(speed < 0){

speed = 0;

}

}

/* =========================
   KONTROL HP
========================= */

let moveInterval;

function holdAction(action){

clearInterval(moveInterval);

moveInterval = setInterval(()=>{

if(action==="left"){

moveLeft();

}

if(action==="right"){

moveRight();

}

if(action==="up"){

accelerate();

}

if(action==="down"){

brake();

}

},16);

}

function stopAction(){

clearInterval(moveInterval);

}

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

const upBtn =
document.getElementById("upBtn");

const downBtn =
document.getElementById("downBtn");

leftBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

holdAction("left");

}
);

rightBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

holdAction("right");

}
);

upBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

holdAction("up");

}
);

downBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

holdAction("down");

}
);

document.querySelectorAll(".controlBtn")
.forEach(btn=>{

btn.addEventListener(
"touchend",
stopAction
);

});

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(e.key==="ArrowLeft"){

moveLeft();

}

if(e.key==="ArrowRight"){

moveRight();

}

if(e.key==="ArrowUp"){

accelerate();

}

if(e.key==="ArrowDown"){

brake();

}

}
);

/* =========================
   RESTART
========================= */

document.getElementById("restartBtn")
.addEventListener(
"click",
()=>{

location.reload();

}
);

/* =========================
   FULLSCREEN
========================= */

document.body.addEventListener(
"click",
()=>{

const el =
document.documentElement;

if(el.requestFullscreen){

el.requestFullscreen()
.catch(()=>{});

}

},
{once:true}
);

</script>

</body>
</html>
