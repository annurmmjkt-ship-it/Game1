<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Balap 3 Mobil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
touch-action:none;
}

/* AREA GAME */
#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:#444;
}

/* JALAN */
#road{
position:absolute;
width:100%;
height:100%;
background:#2c2c2c;
overflow:hidden;
}

/* GARIS JALAN */
.line{
position:absolute;
width:10px;
height:80px;
background:white;
left:50%;
transform:translateX(-50%);
opacity:0.8;
}

/* MOBIL PLAYER */
#player{
position:absolute;
width:80px;
height:140px;
background:linear-gradient(180deg,#ff0000,#b30000);
bottom:30px;
left:50%;
transform:translateX(-50%);
border-radius:15px;
box-shadow:
0 0 20px rgba(255,0,0,0.8),
0 0 40px rgba(255,0,0,0.4);
}

/* KACA MOBIL */
#player::before{
content:"";
position:absolute;
width:55px;
height:35px;
background:#87ceeb;
top:15px;
left:12px;
border-radius:10px;
}

/* MOBIL MUSUH */
.enemy{
position:absolute;
width:80px;
height:140px;
background:linear-gradient(180deg,#ffd600,#ff9800);
border-radius:15px;
top:-200px;
box-shadow:
0 0 20px rgba(255,193,7,0.7);
}

.enemy::before{
content:"";
position:absolute;
width:55px;
height:35px;
background:#87ceeb;
top:15px;
left:12px;
border-radius:10px;
}

/* HUD */
#hud{
position:absolute;
top:15px;
left:15px;
z-index:20;
color:white;
font-size:22px;
font-weight:bold;
background:rgba(0,0,0,0.5);
padding:15px 20px;
border-radius:15px;
backdrop-filter:blur(5px);
line-height:1.6;
}

/* GAME OVER */
#gameOver{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:40px;
border-radius:20px;
text-align:center;
color:white;
display:none;
z-index:50;
width:90%;
max-width:400px;
}

#gameOver h1{
font-size:45px;
margin-bottom:15px;
color:#ffd700;
}

#finalScore{
font-size:28px;
margin-bottom:20px;
line-height:1.5;
}

#restartBtn{
padding:15px 30px;
font-size:24px;
border:none;
border-radius:15px;
background:#00c853;
color:white;
cursor:pointer;
font-weight:bold;
}

/* KONTROL HP */
#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 30px;
z-index:30;
}

.controlBtn{
width:110px;
height:110px;
border-radius:50%;
background:rgba(255,255,255,0.2);
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
color:white;
user-select:none;
backdrop-filter:blur(5px);
position:relative;
bottom:10px;
}

.controlBtn:active{
background:rgba(255,255,255,0.4);
transform:scale(0.95);
}

/* HP */
@media(max-width:768px){

#player,.enemy{
width:70px;
height:120px;
}

#hud{
font-size:18px;
padding:12px 15px;
}

.controlBtn{
width:90px;
height:90px;
font-size:40px;
}

#gameOver h1{
font-size:35px;
}

#finalScore{
font-size:22px;
}

}

/* TV */
@media(min-width:1200px){

#player,.enemy{
width:100px;
height:170px;
}

.controlBtn{
width:150px;
height:150px;
font-size:60px;
}

}

</style>
</head>
<body>

<div id="game">

<div id="road"></div>

<!-- HUD -->
<div id="hud">
<div>🏁 Score: <span id="score">0</span></div>
<div id="levelText">🚀 Level: 1</div>
</div>

<!-- PLAYER -->
<div id="player"></div>

<!-- GAME OVER -->
<div id="gameOver">

<h1>GAME OVER</h1>

<div id="finalScore"></div>

<button id="restartBtn">
MAIN LAGI
</button>

</div>

<!-- KONTROL -->
<div id="controls">

<div class="controlBtn" id="leftBtn">
⬅
</div>

<div class="controlBtn" id="rightBtn">
➡
</div>

</div>

</div>

<script>

/* =========================
   ELEMENT
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const levelText = document.getElementById("levelText");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

/* =========================
   VARIABLE
========================= */

let playerX = window.innerWidth / 2 - 40;

let score = 0;

let level = 1;

let speed = 5;

let playing = true;

/* =========================
   POSISI PLAYER
========================= */

player.style.left = playerX + "px";

/* =========================
   LEVEL
========================= */

function updateLevel(){

if(score >= 20){

level = 3;
speed = 14;

}
else if(score >= 10){

level = 2;
speed = 9;

}
else{

level = 1;
speed = 5;

}

levelText.innerHTML =
"🚀 Level: " + level;

}

/* =========================
   GARIS JALAN
========================= */

for(let i=0;i<15;i++){

let line = document.createElement("div");

line.classList.add("line");

line.style.top = (i * 100) + "px";

document.getElementById("road").appendChild(line);

}

function moveRoad(){

const lines = document.querySelectorAll(".line");

lines.forEach(line=>{

let top = parseInt(line.style.top);

top += speed;

if(top > window.innerHeight){

top = -100;

}

line.style.top = top + "px";

});

}

/* =========================
   MOBIL MUSUH
========================= */

const enemies = [];

for(let i=0;i<3;i++){

createEnemy(i);

}

function createEnemy(index){

let enemy = document.createElement("div");

enemy.classList.add("enemy");

enemy.style.left =
(Math.random() * (window.innerWidth - 100)) + "px";

enemy.style.top = (-350 * index) + "px";

game.appendChild(enemy);

enemies.push(enemy);

}

function moveEnemies(){

enemies.forEach(enemy=>{

let top = parseInt(enemy.style.top);

top += speed + 3;

if(top > window.innerHeight){

top = -250;

enemy.style.left =
(Math.random() * (window.innerWidth - 100)) + "px";

score++;

scoreText.textContent = score;

updateLevel();

}

enemy.style.top = top + "px";

checkCollision(enemy);

});

}

/* =========================
   TABRAKAN
========================= */

function checkCollision(enemy){

const playerRect =
player.getBoundingClientRect();

const enemyRect =
enemy.getBoundingClientRect();

if(
playerRect.left < enemyRect.right &&
playerRect.right > enemyRect.left &&
playerRect.top < enemyRect.bottom &&
playerRect.bottom > enemyRect.top
){

endGame();

}

}

/* =========================
   GAME OVER
========================= */

function endGame(){

playing = false;

gameOver.style.display = "block";

finalScore.innerHTML = `
🏁 Score: ${score}<br>
🚀 Level Tertinggi: ${level}
`;

navigator.vibrate?.([200,100,200]);

}

/* =========================
   UPDATE GAME
========================= */

function update(){

if(!playing) return;

moveRoad();

moveEnemies();

requestAnimationFrame(update);

}

update();

/* =========================
   GERAK PLAYER
========================= */

function moveLeft(){

playerX -= 12;

if(playerX < 0){

playerX = 0;

}

player.style.left = playerX + "px";

}

function moveRight(){

playerX += 12;

if(playerX >
window.innerWidth - player.offsetWidth){

playerX =
window.innerWidth - player.offsetWidth;

}

player.style.left = playerX + "px";

}

/* =========================
   KONTROL HP SMOOTH
========================= */

let moveInterval;

function startMove(direction){

clearInterval(moveInterval);

moveInterval = setInterval(()=>{

if(direction === "left"){

moveLeft();

}else{

moveRight();

}

},16);

}

function stopMove(){

clearInterval(moveInterval);

}

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

leftBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

startMove("left");

}
);

leftBtn.addEventListener(
"touchend",
stopMove
);

rightBtn.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

startMove("right");

}
);

rightBtn.addEventListener(
"touchend",
stopMove
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
(e)=>{

if(e.key === "ArrowLeft"){

moveLeft();

}

if(e.key === "ArrowRight"){

moveRight();

}

}
);

/* =========================
   RESTART
========================= */

restartBtn.addEventListener(
"click",
()=>{

location.reload();

}
);

/* =========================
   FULLSCREEN
========================= */

document.body.addEventListener(
"click",
()=>{

const el =
document.documentElement;

if(el.requestFullscreen){

el.requestFullscreen()
.catch(()=>{});

}

},
{once:true}
);

</script>

</body>
</html>
